name: pintaraja_app
description: PintarAja - Platform AI Tools untuk Mahasiswa Indonesia
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView
  webview_flutter: ^4.14.1

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.2.3

  # Navigation
  go_router: ^13.2.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  lottie: ^3.1.0
  
  # Icons
  iconsax: ^0.0.8

  # Utils
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.2.6
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  record: ^5.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  archive: ^4.0.9
  
  # Google Auth
  google_sign_in: ^6.2.1

  # Chat streaming
  flutter_markdown: ^0.6.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

